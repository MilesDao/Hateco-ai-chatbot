# WordPress cục bộ để thử plugin trước khi đưa lên site thật. Chạy từ thư mục này:
#   docker compose up -d
# Site: http://localhost:8080  (admin / admin)
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wpdata:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/hateco-ai-chatbot:ro

  wpcli:
    image: wordpress:cli
    profiles: [tools]
    user: "33:33"
    depends_on: [wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wpdata:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/hateco-ai-chatbot:ro

volumes:
  dbdata:
  wpdata:
